kind = "web"
previewPath = "/"
title = "DawnPix"
version = "1.0.0"
id = "artifacts/dawnpix"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23122

[services.development]
run = "pnpm --filter @workspace/dawnpix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dawnpix", "run", "build" ]
publicDir = "artifacts/dawnpix/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23122"
BASE_PATH = "/"
